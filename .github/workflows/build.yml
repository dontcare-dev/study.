name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.cjs"
      - "preload.cjs"
      - "package.json"
      - "renderer/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Windows packaging dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 xvfb
      - run: npm install
      - name: Build Windows installer
        run: xvfb-run -a npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Windows
          path: release/*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Linux
          path: release/*.AppImage
          if-no-files-found: error

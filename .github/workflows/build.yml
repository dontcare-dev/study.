name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.cjs"
      - "preload.cjs"
      - "package.json"
      - "renderer/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: source
      - run: npm run build:win
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Windows
          path: source/release/*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: source
      - run: npm run build:linux
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Linux
          path: source/release/*.AppImage
          if-no-files-found: error

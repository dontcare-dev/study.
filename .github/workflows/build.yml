name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.cjs"
      - "preload.cjs"
      - "package.json"
      - "renderer/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Clone repository into a Windows-safe path
        shell: pwsh
        working-directory: D:\
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 https://github.com/dontcare-dev/study. D:\study-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: D:\study-app
        run: npm install
      - name: Build Windows installer
        working-directory: D:\study-app
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Windows
          path: D:\study-app\release\*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate JavaScript
        run: node --check main.cjs && node --check preload.cjs && node --check renderer/app.js
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Linux
          path: release/*.AppImage
          if-no-files-found: error
